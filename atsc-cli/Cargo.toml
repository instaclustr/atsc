[package]
name = "atsc-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for the ATSC v2 time-series compression library"

[dependencies]
atsc = { path = "../atsc" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

[features]
default = []
perf-telemetry = ["atsc/perf-telemetry"]


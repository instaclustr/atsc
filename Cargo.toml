[workspace]
members = [
    "atsc",
    "tools",
    "wavbrro",
    "vsri",
    "csv-compressor"
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Carlos Rolo <carlos.rolo@netapp.com>"]
repository = "https://github.com/instaclustr/atsc"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[workspace.dependencies]
atsc = { version = "0.8.0", path = "atsc" }
vsri = { version = "0.2.0", path = "vsri" }
wavbrro = { version = "0.2.0", path = "wavbrro" }

bincode = "=2.0.0-rc.3"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
csv = "1.4.0"
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.34"
# The WBRO body layout depends on these format features; changing them breaks the file format.
rkyv = { version = "0.8.18", features = ["little_endian", "pointer_width_32", "aligned"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
splines = "~4.3.1"
tempfile = "3.27.0"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "deny"

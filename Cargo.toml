[workspace]
members = [
    "atsc",
    "tools",
    "wavbrro",
    "vsri",
    "csv-compressor"
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Carlos Rolo <carlos.rolo@netapp.com>"]
repository = "https://github.com/instaclustr/atsc"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[workspace.dependencies]
atsc = { version = "0.8.0", path = "atsc" }
vsri = { version = "0.2.0", path = "vsri" }
wavbrro = { version = "0.1.0", path = "wavbrro" }

average = "0.15.1"
bincode = "2.0.0-rc.3"
chrono = "0.4.26"
claxon = "0.4.3"
clap = { version = "4.3.14", features = ["derive"] }
criterion = "0.5.1"
csv = "1.3.1"
dtw_rs = "0.9.5"
env_logger = "0.11.0"
hound = "3.5"
inverse_distance_weight = "0.1.1"
log = "0.4.19"
median = "0.3.2"
num-traits = "0.2"
rand = "0.8.5"
regex = "1.9.1"
rkyv = { version = "0.7.42", features = ["validation"] }
rustfft = "6.1.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1"
splines = "4.3.0"
symphonia = { version = "0.5.3", features = ["flac"] }
tempdir = "0.3.7"
tempfile = "3.2"
thiserror = "2.0.3"

[workspace.lints.rust]
unsafe_code = "deny"

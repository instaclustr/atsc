[package]
name = "atsc"
version = "0.7.2"
authors = ["Carlos Rolo <carlos.rolo@netapp.com>"]
edition = "2021"
license = "Apache-2.0"
description = "An Advanced Time-Series Compressor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
thiserror = "2"
log = "0.4"
rustfft = "6.1"
splines = "4.3"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.8"

[features]
default = []
rayon = ["dep:rayon"]

[[bench]]
name = "fft_bench"
harness = false

[[bench]]
name = "polynomial_bench"
harness = false
